[entity-description]
acidworking-plant=能够进行高等酸处理。在伏卤星上这台机器会产生酸蚀污染，腐蚀周围的脆弱实体。
smelting-plant=能熔炼材料也能进行冶金加工的建筑。能够加工铅。在伏卤星上这台机器会产生酸蚀污染，腐蚀周围的脆弱实体。
fungicultural-tower=用于培养菌类和地衣的机器。
acidthrower-turret=这台喷射酸液的战争机器能够融化你的对手，就和火焰炮塔差不多。
metallic-lichen-colony=培养于氯盐的嗜酸地衣菌落。
cotunnite-lichen-colony=培养于氯铅矿的嗜酸地衣菌落。
holmium-lichen-colony=培养于氯化钬的嗜酸地衣菌落。
eschatotaxite=能吸收大气中酸蚀气体的高大真菌菌落。
chloride-salt-deposit=氯盐矿床。
biovat=能进行生化加工的低效机器。会部分吸收伏卤星上的酸蚀气体。
big-chloric-rock=由氯盐和石头混合形成的大型岩石。
scrubber=能借助催化剂从大气中吸收污染物和大气成分的机器。
lead-construction-robot=抗性更强但较慢的建设机器人。可以运载更多货物。
lead-logistic-robot=抗性更强但较慢的物流机器人。可以运载更多货物。
shotgun-turret=发射霰弹的强大炮塔。会对前面的友方实体造成伤害。

