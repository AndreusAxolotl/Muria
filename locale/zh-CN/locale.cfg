[item-description]
acidophile-lichen=类似地衣的硅基生命体，以氯盐为生存养料。
artificial-lichen-colony=可供嗜酸地衣生长的土壤。可放置在[planet=muria]的[tile=muriatic-solution]和深色地带，以及[planet=fulgora]的油海上。
artificial-muriatic-soil=可供[entity=eschatotaxite]生长的人造土。可放置在[planet=muria]的[tile=muriatic-solution]和[tile=acidophile-lichen]上。
chloride-salts=铁氯化物与铜氯化物的混合物。可“种植”在[tile=acidophile-lichen]上。
cotunnite=一块氯化铅。可“种植”在[tile=acidophile-lichen]上。
chloric-fuel=被捕获的嗜酸地衣样本，其奇特的能量合成方式可以用来驱动若干种特种伏卤星机器。
eschatotaxite-sprout=端界菌的幼体。可种植在[planet=muria]的各种深色地格上。
eschatotaxite-paste=富含碳的天然胶状物，尽管尝起来像在啃木炭，但实际上它的营养价值很高。
acidthrower=经过改造的火焰喷射器，内有一只接受过基因编辑的喷吐虫。
holmium-chloride=人工催生的氯化钬块。可“种植”在[planet=fulgora]上的[tile=artificial-lichen-colony]上。
leaded-fuel=动力强劲的高污染燃料。
inert-acidworking-science-pack=瓶中的化学反应必须用[fluid=hydrogen-chloride]活化。
corroded-flask=[item=acidworking-science-pack]的腐蚀产物。
anti-corrosion-cladding=耐腐蚀的覆板，是要与伏卤星大气对抗的、或要常态接触酸的机器的理想材料。
muriatic-solution-barrel=桶装卤液。存放一定时间后会卤液会蚀穿桶壁并泄露。高品质的空桶能坚持更长时间，但泄露后的爆炸也猛烈。

