[technology-description]
planet-discovery-muria=伏卤星（Muria）：因强烈温室效应而相对温暖的小型星球，温室气体挥发自高腐蚀性的[fluid=muriatic-solution]浅湖。湖中的流体可用[entity=offshore-pump]抽取。星球表面似乎存在生命迹象。
lichen-cultivation=看起来[item=acidophile-lichen]能在[item=chloride-salts]分解为[fluid=chlorine]和金属时捕获反应释放的能量。也就是说，在[tile=acidophile-lichen]上“种植”这种盐即能在这颗星球上可靠地获取金属。不过，菌落长成后会向大气释放腐蚀性极强的物质，对附近的工厂来说是个威胁。
eschatotaxite-farming=以自身腐败部分为食的高大真菌群落。富含碳和硫。它们似乎能吸收[entity=metallic-lichen-colony]和[entity=cotunnite-lichen-colony]释放出的酸蚀气体。
lead-processing=向[tile=acidophile-lichen]“种植”由[fluid=muriatic-solution]提取而来的[item=cotunnite]，可释放出其中的铅，开启这种耐腐蚀金属的加工流程。
acidworking=能处理高腐蚀性材料的加工技术。[entity=acidworking-plant]的运作需要[item=chloric-fuel]。
advanced-lead-processing=利用[item=chloric-fuel]，技术上允许在特种的[entity=smelting-plant]内以一种更先进的方式处理[item=lead]。与此同时，也能加工出铅颗粒和重型霰弹。
acidworking-science-pack=允许以更先进的方式应用酸性和剧毒材料。本科技也会解锁能飞离伏卤星的火箭的制造方式。
offworld-chlorine-compounds-production=能在[planet=muria]之外获取和加工[fluid=chlorine]与[fluid=hydrogen-chloride]的处理技术。
toxic-rounds-magazine=装载酸蚀物质的子弹。
hydrogen-chloride-explosives=利用了[fluid=hydrogen-chloride]性质的[item=explosives]替代配方。
hydrogen-chloride-lead-battery=用到了[item=lead-plate]的[item=battery]替代配方。
acid-weaponization=着力发展先进化学武器。
refined-acid-weaponry=提高酸蚀武器的伤害。
hydronium-destruction-productivity=更先进的[fluid=hydronium]电解回收技术能够回收更多的[fluid=oxygen]和[fluid=hydrogen]。
oxygenated-bacteria-cultivation=在细菌培养过程中充氧可以增加产量。
holmium-chloride=进一步研究氯盐，即可人工制备[item=holmium-chloride]以拓展钬处理产线，并增加雷神星上的钬产量。
shotgun-turret=经过改造的机枪炮塔，能够发射重型霰弹。很适合用来摧毁[planet=muria]附近的晶质星岩。
advanced-paste-applications=端界菌菌膏的性质多种多样，能在重要配方中替代塑料和玉玛果泥。
shotgun-turret-damage=提高霰弹炮塔的伤害。
murian-oil-processing=加工处理来自[entity=eschatotaxite]的生物质和其他伏卤星资源，即可在伏卤星上获得原油和原油产品。
leaded-fuel=使用铅颗粒升级的火箭燃料，在速度倍率很高的同时污染也很高。
air-scrubbing=借助[fluid=water]和其他催化剂，就可洗涤不同星球的大气来减少污染，并收集空气中的痕量资源。
hydrogen-chloride-from-biter-egg=从还在发育的撕咬虫和喷吐虫体内轻柔地取出酸液腺体，即可在新地星上轻松获得[fluid=hydrogen-chloride]。
explosive-shotgun-shell=使用[fluid=chlorine]-[item=carbon]炸药的改装型霰弹。适合用来摧毁太空中的大型星岩。
advanced-acid-processing=使用和生产[fluid=sulfuric-acid]与[fluid=hydrogen-chloride]的先进加工技术。
lead-robots=由[item=anti-corrosion-cladding]强化的机器人。它们的抗性更高，货物运量较大，且能免疫伏卤星的酸蚀气体，但它们的速度较慢。
pickled-casting=更先进的浇铸技术。同时使用熔融金属和[fluid=hydrogen-chloride]，即可酸洗去杂质以减少浪费，将中间产品浇铸配方的熔融金属需求减少25%。
lead-refining=能提升铅品质的高等配方。
murian-soil=可用于重整伏卤星地表的人造土。
casting-anti-corrosion-cladding=[fluid=fluorine]可用于批量浇铸[item=anti-corrosion-cladding]。
advanced-acidworking-science-pack-activation=借助[fluid=hydrogen-fluoride]，活化[item=acidworking-science-pack]时可以连带提高它的品质。

