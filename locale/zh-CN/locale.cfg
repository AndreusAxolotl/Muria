[tips-and-tricks-item-description]
muria-briefing=[planet=muria]（Muria），一个富含生命的剧毒世界。星球的干燥地带长有许多[tile=acidophile-lichen]和[entity=eschatotaxite]，其余地表则被[fluid=muriatic-solution]湖泊所覆盖。[entity=chloride-salt-deposit]和[item=cotunnite]是含有[fluid=chlorine]的盐类，可使用多种方式在地表获取。两者均可通过[entity=fungicultural-tower]和地衣提纯成矿石。端界菌可以保护你的工厂免受其害。
acid-immunity-list=采集[entity=metallic-lichen-colony]和[entity=cotunnite-lichen-colony]会释放出酸蚀气体。这种气体会损害你的大多数机器。地图上的污染叠加层指示了危险区域。种植和采集[entity=eschatotaxite]可以清除部分酸蚀气体。\n[planet=muria]上受污染地格处的大多数玩家所建机器都会不断受到伤害，但也有几项例外。\n免疫的实体：\n- 显然，作为污染的主要来源和主要吸收器，[entity=fungicultural-tower]免疫这种伤害。\n- [entity=acidworking-plant]和[entity=smelting-plant]（这两种机器其实会释放出酸蚀气体，务必小心）。\n- [entity=biovat]（生物仓能吸收大气中的部分酸蚀气体）。\n- [entity=scrubber]（本身就是用来清理酸蚀气体和其他污染的）。\n- 所有供电实体（电线杆、发电器、蓄电器等）。\n- 所有物流实体，机器人除外。机器人指令平台不受酸蚀气体影响。经过铅强化的机器人也免疫酸蚀气体。\n- 列车（[entity=locomotive]、[item=rail]等）。\n- [entity=rocket-silo]、[entity=cargo-landing-pad]、[entity=cargo-bay]。\n- 所有采矿机。\n- [entity=beacon]。\n- 所有管道。\n- 所有箱子。

[planet-effect-alert]
muria-corrosive-effect-destroyed-entity=伏卤星的酸蚀空气摧毁了一台机器。在伏卤星上，有污染的区块会损害你的大多数机器。更多信息参见提示与技巧。

