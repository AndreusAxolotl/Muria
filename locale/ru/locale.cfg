[item-description]
acidophile-lichen=Кремниевые формы жизни - лишайники, потребляющие хлоридные соли для жизнедеятельности.
artificial-lichen-colony=Почва для выращивания кислотолюбивых лишайников, которую можно разместить на [tile=muriatic-solution] и темных почвах [planet=muria], а также на нефтяном океане [planet=fulgora].
artificial-muriatic-soil=Искусственная почва для выращивания [entity=eschatotaxite]. Можно размещать на [tile=muriatic-solution] и [tile=acidophile-lichen] планеты [planet=muria].
chloride-salts=Смесь хлорида железа и хлорида меди. Может быть размещён на [tile=acidophile-lichen].
cotunnite=Скопление хлорида свинца. Может быть размещён на [tile=acidophile-lichen].
chloric-fuel=Энергоноситель, созданный специфическим синтезом кислотолюбивого лишайника, используется для энергетики специализированных мурианских машин.
eschatotaxite-sprout=Грибок эшатотаксита. Может быть высажен на все тёмные почвы [planet=muria].
eschatotaxite-paste=Богатый углеродом природный гель. На вкус как древесный уголь, очень питательный.
acidthrower=Модифицированная огнемётная турель с изменённым затвором.
holmium-chloride=Искусственное скопление хлорида гольмия. Может быть размещён на [tile=artificial-lichen-colony] на [planet=fulgora].
leaded-fuel=Выраженное загрязнение и мощное топливо.
inert-acidworking-science-pack=Химической реакции внутри научного пакета, должна быть активирована с помощью [fluid=hydrogen-chloride].
corroded-flask=Результат коррозии [item=acidworking-science-pack].
anti-corrosion-cladding=Коррозионно-стойкое покрытие, идеально подходит для оборудования, которое имеет дело с мурианской атмосферой или постоянного контактирующего с кислотами.
muriatic-solution-barrel=Солянокислый рааствор в бочкее. Так или иначе придет в негодность, что приведет к разливу кислоты.  Бочки более высокого качества устойчивы дольше, но взрываются еще сильнее.

