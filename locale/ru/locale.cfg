[entity-description]
acidworking-plant=Позволяет использовать более продвинутую обработку кислоты. Эта машина производит кислоты на Мурии, а также разрушает расположенные рядом объекты посредством коррозии.
smelting-plant=Здание, способное плавить материалы и выполнять металлургические процессы. Позволяет работать со свинцом. На Мурии эта машина выделяет кислоты, вызывая коррозию уязвимых объектов поблизости.
fungicultural-tower=Машина предназначена для выращивания грибов и лишайника.
acidthrower-turret=В отличие от огнеметной турели, эта кислотная боевая машина расплавит ваших врагов.
metallic-lichen-colony=Колония кислотолюбивых лишайников, растущих на хлоридных солях.
cotunnite-lichen-colony=Колония кислотолюбивых бактерий, растущая на коттуните.
holmium-lichen-colony=Колония кислотолюбивых бактерий, растущая на хлориде гольмия.
eschatotaxite=Возвышающиеся колонии грибков, потребляющие коррозионные кислоты в воздухе.
chloride-salt-deposit=Залежи хлоридных солей.
biovat=Малоэффективная машина, способная работать с биологическими процессами. Поглощает некоторое количество кислот из атмосферы Мурии.
big-chloric-rock=Крупный конгломерат хлоридных солей и камня.
scrubber=Машина, способная поглощать загрязняющие вещества и микрочастицы из атмосферы с использованием катализатора.
lead-construction-robot=Более медленный строительный дрон с повышенной прочностью. Способен переносить дополнительный груз.
lead-logistic-robot=Более медленный логистический дрон с повышенной прочностью. Способен переносить дополнительный груз.
shotgun-turret=Мощная турель, которая стреляет дробью. Также наносит урон дружественным целям перед собой.

