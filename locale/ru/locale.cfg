[technology-description]
planet-discovery-muria=Небольшая планета, тепло на которой поддерживается сильным парниковым эффектом. Испарения газов от мелких озер обладают высокой коррозионной активностью [fluid=muriatic-solution]. Жидкость из этих озер можно выкачивать, используя [entity=offshore-pump]. Кажется, на поверхности есть жизнь.
lichen-cultivation=Похоже, что [item=acidophile-lichen], поглощают энергию, выделяющуюся из [item=chlorine-salts] когда [fluid=chlorine] дегалогенируется из молекул солей металлов. Надежным способом получения металлов на этой планете является размещение соли на [tile=acidophile-lichen]. Колонии этих организмов высвобождают в воздух черезвычайно мощные окислители, что создает опасность для завода.
eschatotaxite-farming=Высокие колонии грибов, питающиеся гниющими частями других колоний. Чрезвычайно насыщены углеродом и серой. Они потребляют коррозионные кислоты, выпущенные [entity=metallic-lichen-colony] и [entity=cotunnite-lichen-colony].
lead-processing=Поместите [item=cotunnite], извлеченный из fluid=muriatic-solution], на [tile=acidophile-lichen], чтобы извлечь [item=lead] из породы и начать обработку этого устойчивого к коррозии металла.
acidworking=Новые пути обработки очень агрессивных материалов [entity=acidworking-plant] требуют [item=chloric-fuel] для работы.
advanced-lead-processing=Посредством [item=chloric-fuel] можно начать продвинутую цепь обработки [item=lead] внутри специализированного [entity=smelting-plant]. Наряду с этим, откроет такие материалы как свинцовые гранулы и утяжеленную дробь.
acidworking-science-pack=Позволяет применять продвинутые версии кислотных и токсичных материалов, а также создавать ракеты, способные покинуть Мурию.
offworld-chlorine-compounds-production=Процессы получения и обработки [fluid=chlorine] и [fluid=hydrogen-chloride] за пределами [planet=muria].
toxic-rounds-magazine=Пули, начиненные кислотами.
hydrogen-chloride-explosives=Альтернативный рецепт [item=explosives] с использованием свойств [fluid=hydrogen-chloride].
hydrogen-chloride-lead-battery=Альтернативный рецепт [item=battery] с использованием [item=lead-plate].
acid-weaponization=Начните создавать продвинутый химический арсенал.
refined-acid-weaponry=Увеличивает урон кислотного оружия.
hydronium-destruction-productivity=Более современные методы разрушения [fluid=hydronium] позволяют восстановить больше молекул [fluid=oxygen] и [fluid=водород].
oxygenated-bacteria-cultivation=Добавляя кислород в среду выращивания бактерий, повышается эффективность инкубации бактерий.
holmium-chloride=Более эффективное исследование солей хлора позволяет  искусственно синтезировать [item=holmium-chloride] для улучшения производства гольмия на Фулгоре.
shotgun-turret=Измененная пулеметная турель, способная стрелять тяжелой дробью. Хорошо подходит для уничтожения кристаллических астероидов вблизи [planet=muria].
advanced-paste-applications=При использовании многих свойств эшатотакситовой пасты можно изменить цепочку производства, заменив пластик и пюре юмако в важных рецептах.
shotgun-turret-damage=Увеличение урона осколочной турели.
murian-oil-processing=Перерабатывая биомассу, полученную из [entity=eschatotaxite], с другими мурианскими ресурсами мы можем получить нефть и другие нефтепродукты на Мурии.
leaded-fuel=Используя свинцовые гранулы, можно получить альтернативу ракетному топливу с невероятным бонусом ускорения транспорта, пожертвовав чистотой окружающей среды.
air-scrubbing=Используя [fluid=water] и различные катализаторы, можно очищать атмосферу планет для уменьшения присутствия загрязняющих веществ и получения редких ресурсов из фильтрата.
hydrogen-chloride-from-biter-egg=Аккуратно извлекая кислотообразующие железы у растущих кусак и плевак, мы можем получить простой источник [fluid=hydrogen-chloride] на Наувисе.
explosive-shotgun-shell=Модифицированные снаряды дроби, начиненные [fluid=chlorine]-[item=carbon]. Идеально подходит для уничтожения больших астероидов в космосе.
advanced-acid-processing=Более продвинутые процессы использования и производства [fluid=sulfuric-acid] и [fluid=hydrogen-chloride].
lead-robots=Роботы усиленные при помощи [item=anti-corrosion-cladding]. Они обладают более высоким сопротивлением, повышенной грузоподъемностью и переносят кислотность Мурии, однако их скорость ниже.
pickled-casting=Более продвинутый способ выплавки. Используя [fluid=hydrogen-chloride] наряду с расплавленным металлом, можно уменьшить отходы за счет вытравливания примесей, позволяя использовать на 25% меньше расплавленного металла в литье промежуточных компонентов.
lead-refining=Улучшенный рецепт для повышения качества свинца.
murian-soil=Искусственная почва, позволяющая изменять ландшафт Мурии.

casting-anti-corrosion-cladding=Используя [fluid=fluorine], можно получить массовое литье [item=anti-corrosion-cladding].
advanced-acidworking-science-pack-activation=Используя [fluid=hydrogen-fluoride], можно повысить качество [item=acidworking-science-pack] при активации.

