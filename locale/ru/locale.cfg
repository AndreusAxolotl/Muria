[tips-and-tricks-item-description]
muria-briefing=[planet=muria] — чрезвычайно токсичный мир, богатый жизнью. Сушу планеты покрывают [tile=acidophile-lichen] и грибы [entity=eschatotoxite], а остальную поверхность занимают озёра крайне едкого [fluid=muriatic-solution]. [entity=chloride-salt-deposit] и [item=cotunnite] представляют собой соли [fluid=chlorine], которые можно найти на поверхности разными способами. Оба ресурса можно очистить до руд с помощью [entity=fungicultural-tower] и лишайника. Остерегайтесь едкого воздуха, выделяемого лишайником — эсшатотакситы способны защитить вашу фабрику от его урона.
acid-immunity-list=Сбор урожая с [entity=metallic-lichen-colony] и [entity=cotunnite-lichen-colony] приводит к выбросу едких газов. Эти газы наносят урон большинству ваших машин. Слой загрязнения на карте показывает, какие области будут опасны для техники. Едкость атмосферы можно снизить, высаживая и собирая [entity=eschatotoxite].\nБольшинство построенных игроком объектов в загрязнённых клетках на [planet=muria] будут получать постоянный урон от едких кислот, за некоторыми исключениями.\nНеуязвимые объекты:\n- [entity=fungicultural-tower] (очевидно, обладает иммунитетом, так как является главным источником и поглотителем кислот).\n- [entity=acidworking-plant] и [entity=smelting-plant] (эти две машины, наоборот, усиливают выброс едких кислот, так что будьте осторожны).\n- [entity=biovat] (поглощает часть кислот из воздуха).\n- [entity=scrubber] (машина предназначена для поглощения кислот и других загрязнителей).\n- Все объекты энергосети (опоры ЛЭП, генераторы и аккумуляторы).\n- Все объекты логистики не получают урона, за исключением роботов. Дронстанции урона не получают, а улучшенные освинцованные роботы имеют иммунитет к кислотам.\n- Железнодорожный транспорт ([entity=locomotive], [item=rail] и т. д.) также неуязвим.\n- [entity=rocket-silo], [entity=cargo-landing-pad] и [entity=cargo-bay].\n- Все буры.\n- [entity=beacon].\n- Все трубы.\n- Все сундуки.

